name: DeckHand
options:
  bundleIdPrefix: com.deckhand
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.4"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Debug

packages:
  Loom:
    path: ../

settings:
  base:
    SWIFT_VERSION: 6.0
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

configs:
  Debug: debug
  Release: release

targets:

  # ─────────────────────────────────────────────────────────────
  # macOS Host
  # ─────────────────────────────────────────────────────────────
  DeckHandMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: DeckHandMac
        type: group
      - path: Shared
        type: group
    dependencies:
      - package: Loom
        product: LoomKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deckhand.mac
        INFOPLIST_FILE: DeckHandMac/Info.plist
        CODE_SIGN_ENTITLEMENTS: DeckHandMac/DeckHandMac.entitlements
        PRODUCT_NAME: Deck Hand
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        # Required for CGEvent mouse injection
        ENABLE_HARDENED_RUNTIME: YES
        # The entitlements this target ships need a real profile, so ad-hoc
        # ("-") signing cannot satisfy the build.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: VCBDYB22D9

  # ─────────────────────────────────────────────────────────────
  # iOS / iPadOS Client
  # ─────────────────────────────────────────────────────────────
  DeckHandiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - path: DeckHandiOS
        type: group
      - path: Shared
        type: group
    dependencies:
      - package: Loom
        product: LoomKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deckhand.ios
        INFOPLIST_FILE: DeckHandiOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: DeckHandiOS/DeckHandiOS.entitlements
        PRODUCT_NAME: Deck Hand
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"  # iPhone + iPad
        IPHONEOS_DEPLOYMENT_TARGET: "17.4"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_VERSION: 6.0

  # ─────────────────────────────────────────────────────────────
  # Wire-format contract tests (WID-400)
  # Compiles Shared/ directly so the tests exercise the exact
  # sources both apps ship, without needing a host app.
  # ─────────────────────────────────────────────────────────────
  DeckHandTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: DeckHandTests
        type: group
      - path: Shared
        type: group
    dependencies:
      - package: Loom
        product: LoomKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deckhand.tests
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: 6.0
